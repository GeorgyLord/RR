<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings</title>
    <style>
        body {
            margin: 0;
        }

        main {
            margin: 5%;
            display: flex;
            justify-content: center;
        }

        .header_block {
            display: flex;
            justify-content: center;
            width: 100%;
            max-width: 200px;
            height: 100%;
        }

        header {
            width: 100%;
            height: 60px;
            background-color: rgb(225, 225, 225);
            display: flex;
            position: sticky;
            top: 0;
        }

        .block {
            padding-left: 50px;
            padding-right: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>

<body>
    <header>
        <div class="header_block">
            <a class="block" href="/">Главная</a>
        </div>
    </header>
    <main>
        <div class="a">
            <div>
                ID Пользователя: <b>{{id_user}}</b>
            </div>
            <div>
                Любимые рецепты:
            </div>
            <div>
                {% for id_recipe in list_pos %}
                <a href="/recipe/{{id_recipe}}">{{id_recipe}}</a>
                {% endfor%}
            </div>
            <div>
                Нелюбимые рецепты:
            </div>
            <div>
                {% for id_recipe in list_neg %}
                <a href="/recipe/{{id_recipe}}">{{id_recipe}}</a>
                {% endfor%}
            </div>
        </div>
    </main>
</body>

</html>
